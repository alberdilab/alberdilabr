{{=<% %>=}}
# Renders the bookdown publication and deploys it to GitHub Pages.
#
# Generated by alberdilabr. Action versions follow the maintained example at
# https://github.com/r-lib/actions/tree/v2/examples (bookdown-gh-pages.yaml).
#
# Before the first run, set Settings -> Pages -> Source to "GitHub Actions".

on:
  push:
    branches: [<%branch%>]
  workflow_dispatch:

name: publish

permissions:
  contents: read

# Let an in-flight deployment finish rather than cancelling it half-way.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-pandoc@v2

      # r-version: renv reads the R version recorded in renv.lock, so CI uses
      # the same R as the machine that created the lockfile.
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: renv

      - uses: r-lib/actions/setup-renv@v2

      - name: Cache bookdown intermediates
        uses: actions/cache@v5
        with:
          path: _bookdown_files
          key: bookdown-${{ hashFiles('**/*.Rmd') }}
          restore-keys: bookdown-

      - name: Render book
        run: bookdown::render_book("index.Rmd")
        shell: Rscript {0}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: "<%output_dir%>"

  deploy:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write      # deploy to Pages
      id-token: write   # verify the deployment origin

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
