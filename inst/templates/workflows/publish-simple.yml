{{=<% %>=}}
# Renders the bookdown publication and deploys it to GitHub Pages.
#
# Generated by alberdilabr. Action versions follow the maintained example at
# https://github.com/r-lib/actions/tree/v2/examples (bookdown-gh-pages.yaml).
#
# This project has no renv.lock, so package versions are NOT pinned and a
# dependency update can change or break the build. To pin them, run
# renv::init() locally, commit renv.lock, and swap the "Install R packages"
# step below for:
#
#   - uses: r-lib/actions/setup-r@v2
#     with:
#       r-version: renv
#   - uses: r-lib/actions/setup-renv@v2
#
# Before the first run, set Settings -> Pages -> Source to "GitHub Actions".

on:
  push:
    branches: [<%branch%>]
  workflow_dispatch:

name: publish

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install R packages
        run: install.packages(c("bookdown", "rmarkdown", "knitr", "bslib", "downlit", "xml2"))
        shell: Rscript {0}

      - name: Cache bookdown intermediates
        uses: actions/cache@v5
        with:
          path: _bookdown_files
          key: bookdown-${{ hashFiles('**/*.Rmd') }}
          restore-keys: bookdown-

      - name: Render book
        run: bookdown::render_book("index.Rmd")
        shell: Rscript {0}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: "<%output_dir%>"

  deploy:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
